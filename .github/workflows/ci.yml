name: CI

# Builds every plugin on every system, runs the tests and pluginval. On a v* tag, also publishes the builds as a release.
#
# The branch rule requires each system's check, and GitHub would wait forever on a required check that never
# started. So a pull request that only changes docs still runs the jobs, and their steps skip themselves.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A new push to a pull request replaces the run it just made out of date.
# Other runs always finish: main's fill the compiler cache that pull requests read, and tags publish releases.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, tests: build/ci-windows/tests/cdaw_plugins_tests_artefacts/Release/cdaw_plugins_tests.exe, config: Release }
          - { name: macos, os: macos-latest, tests: build/ci-macos/tests/cdaw_plugins_tests_artefacts/Release/cdaw_plugins_tests, config: Release }
          - { name: linux, os: ubuntu-24.04, tests: xvfb-run -a build/ci-linux/tests/cdaw_plugins_tests_artefacts/Release/cdaw_plugins_tests, config: Release }

    env:
      # A release is always compiled from scratch, so what people download never comes from a cache.
      SCCACHE_GHA_ENABLED: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # If the cache service has a problem, compile normally instead of failing the build.
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      # macOS builds for two architectures at once, which sccache only caches when asked.
      SCCACHE_CACHE_MULTIARCH: "1"

    steps:
      - name: See whether any code changed
        id: changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep going if gh fails: that means build, not stop.
          set +e
          # Both ends of a rename: moving a source file into docs/ is not a docs change.
          files=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --paginate --jq '.[]|.filename,.previous_filename|select(.)')
          listed=$?
          count=$(printf '%s\n' "$files" | grep -c . || true)
          code=$(printf '%s\n' "$files" | grep -Ev '\.md$|^docs/|^\.github/ISSUE_TEMPLATE/|^\.github/pull_request_template' || true)
          # GitHub lists at most 3000 files. If the list can't be trusted, build: only a known docs-only change skips.
          if [ "$listed" -eq 0 ] && [ "$count" -gt 0 ] && [ "$count" -lt 3000 ] && [ -z "$code" ]; then
            build=false
          else
            build=true
          fi
          echo "Build needed: $build"
          echo "code=$build" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.changes.outputs.code != 'false'
        with:
          submodules: true

      - name: Install JUCE's dependencies
        if: runner.os == 'Linux' && steps.changes.outputs.code != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev xvfb

      # The compiler cache can't work through the Visual Studio generator, so Windows builds with Ninja.
      - name: Install Ninja
        if: runner.os == 'Windows' && steps.changes.outputs.code != 'false'
        run: choco install ninja --no-progress -y

      - name: Set up the compiler cache
        if: steps.changes.outputs.code != 'false'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0

      - name: Build (Windows)
        if: runner.os == 'Windows' && steps.changes.outputs.code != 'false'
        shell: powershell
        run: .\scripts\build.ps1 -Preset ci-windows

      - name: Build
        if: runner.os != 'Windows' && steps.changes.outputs.code != 'false'
        run: |
          cmake --preset ci-${{ matrix.name }}
          cmake --build --preset ci-${{ matrix.name }}

      - name: Test
        if: steps.changes.outputs.code != 'false'
        shell: bash
        run: ${{ matrix.tests }}

      - name: Run pluginval on each VST3
        if: steps.changes.outputs.code != 'false'
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) asset=pluginval_Windows.zip; exe=./pluginval.exe; pre= ;;
            macOS)   asset=pluginval_macOS.zip;   exe=./pluginval.app/Contents/MacOS/pluginval; pre= ;;
            Linux)   asset=pluginval_Linux.zip;   exe=./pluginval; pre="xvfb-run -a" ;;
          esac
          # Retry, so a brief problem on GitHub's download servers doesn't fail a required check.
          curl -fsSL --retry 5 --retry-all-errors -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/$asset"
          unzip -q pluginval.zip
          status=0
          count=0
          summary=""
          for plugin in build/ci-${{ matrix.name }}/VST3/*/*_artefacts/Release/VST3/*.vst3; do
            echo "::group::$plugin"
            start=$SECONDS
            if $pre $exe --strictness-level 5 --validate-in-process --timeout-ms 300000 "$plugin" | tee pluginval.log; then
              result=passed
            else
              result=FAILED
              echo "::error::pluginval failed on $plugin"
              status=1
            fi
            echo "::endgroup::"
            count=$((count + 1))
            summary="$summary $(basename "$plugin" .vst3) $result $((SECONDS - start))s $(wc -l < pluginval.log | tr -d ' ') lines,"
          done
          # Readable without logging in, unlike the log itself.
          echo "::notice::pluginval on $count plugins:$summary"
          if [ "$count" -ne 11 ]; then
            echo "::error::Expected 11 plugins, found $count"
            status=1
          fi
          exit $status

      - name: Package
        if: steps.changes.outputs.code != 'false'
        run: python scripts/package.py build/ci-${{ matrix.name }} ${{ matrix.config }} ${{ matrix.name }}

      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.code != 'false'
        with:
          name: cdaw-plugins-${{ matrix.name }}
          path: dist/cdaw-plugins-${{ matrix.name }}.zip

      - name: Show how much the cache saved
        if: always() && steps.changes.outputs.code != 'false'
        continue-on-error: true
        run: sccache --show-stats

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" *.zip --repo "${{ github.repository }}" --title "${{ github.ref_name }}" \
            --notes "Install notes are in the README. The source for this release is the tag ${{ github.ref_name }}, licensed under AGPL-3.0-or-later."
