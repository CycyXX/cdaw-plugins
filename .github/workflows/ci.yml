name: CI

# Builds every plugin on every system, runs the tests and pluginval. On a v* tag, also publishes the builds as a release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, tests: build/windows/tests/cdaw_plugins_tests_artefacts/Release/cdaw_plugins_tests.exe, config: Release }
          - { name: macos, os: macos-latest, tests: build/macos/tests/cdaw_plugins_tests_artefacts/Release/cdaw_plugins_tests, config: Release }
          - { name: linux, os: ubuntu-24.04, tests: xvfb-run -a build/linux/tests/cdaw_plugins_tests_artefacts/Release/cdaw_plugins_tests, config: Release }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install JUCE's dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Configure
        run: cmake --preset ${{ matrix.name }}

      - name: Build
        run: cmake --build --preset ${{ matrix.name }} --parallel 4

      - name: Test
        shell: bash
        run: ${{ matrix.tests }}

      - name: Run pluginval on each VST3
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) asset=pluginval_Windows.zip; exe=./pluginval.exe; pre= ;;
            macOS)   asset=pluginval_macOS.zip;   exe=./pluginval.app/Contents/MacOS/pluginval; pre= ;;
            Linux)   asset=pluginval_Linux.zip;   exe=./pluginval; pre="xvfb-run -a" ;;
          esac
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/$asset"
          unzip -q pluginval.zip
          status=0
          for plugin in build/${{ matrix.name }}/VST3/*/*_artefacts/Release/VST3/*.vst3; do
            echo "::group::$plugin"
            $pre $exe --strictness-level 5 --validate-in-process --timeout-ms 300000 "$plugin" || { echo "::error::pluginval failed on $plugin"; status=1; }
            echo "::endgroup::"
          done
          exit $status

      - name: Package
        run: python scripts/package.py build/${{ matrix.name }} ${{ matrix.config }} ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: cdaw-plugins-${{ matrix.name }}
          path: dist/cdaw-plugins-${{ matrix.name }}.zip

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" *.zip --repo "${{ github.repository }}" --title "${{ github.ref_name }}" \
            --notes "Install notes are in the README. The source for this release is the tag ${{ github.ref_name }}, licensed under AGPL-3.0-or-later."
